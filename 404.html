<!doctype html>

<head>

<meta name="theme-color" content="#191b1c">
<title>Page Not Found | JP Infra Projects</title>
<meta name="description" content="The page you're looking for may have moved or is no longer available.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
.error-page{min-height:100svh;background:#191b1c;color:#f3f1ec;display:flex;flex-direction:column}
.error-main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:130px clamp(22px,5vw,80px) 90px;position:relative;overflow:hidden}
.error-main:before{content:"404";position:absolute;font:800 min(48vw,560px)/.85 Manrope,sans-serif;letter-spacing:-.09em;color:#ffffff05;pointer-events:none}
.error-content{position:relative;max-width:650px}
.error-code{font-size:11px;letter-spacing:.22em;color:#c66a30;font-weight:700;margin-bottom:22px}
.error-content h1{font:800 clamp(42px,7vw,88px)/1 Manrope,sans-serif;letter-spacing:-.07em;margin:0 0 20px}
.error-content h1 em{font-style:normal;color:#c66a30}
.error-content p{color:#b7b9b7;max-width:460px;margin:0 auto 32px}
.error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.error-footer{padding:24px clamp(22px,5vw,80px);border-top:1px solid #ffffff1a;display:flex;justify-content:space-between;gap:16px;color:#888;font-size:11px}
.error-brand{display:flex;align-items:center;gap:12px;white-space:nowrap;font:800 15px Manrope,sans-serif;letter-spacing:-.04em;color:#f3f1ec}
.error-brand img{width:48px;height:50px;object-fit:contain}
@media(max-width:600px){.error-footer{flex-direction:column;align-items:flex-start}.error-brand{font-size:13px}.error-brand img{width:42px;height:46px}}
</style>
</head>
<body class="error-page">
<main class="error-main">
<div class="error-content">
<div class="error-code">JP INFRA PROJECTS · 404</div>
<h1>Looks like this<br><em>path ends here.</em></h1>
<p>The page you're looking for may have moved, or the link may no longer be available. Let's get you back on track.</p>
<div class="error-actions">

<a class="btn btn-outline" href="services.html">Explore capabilities <span>↗</span></a>
</div>
</div>
</main>
<footer class="error-footer">

<span>© JP Infra Projects. Built with purpose. Designed to last.</span>
